# Optional Ray Job runtime_env.
# Direct `bash run_*.sh ...` launchers do NOT depend on this file; they source
# common_env.sh so paths can be selected dynamically. If your Ray Job uses a
# /home source layout, override this runtime_env instead of blindly reusing the
# /workspace paths below.
env_vars:
  PATH: "/opt/areal-venv-py31115/bin:/opt/hyhal/bin:/opt/dtk/hip/bin:/opt/dtk/bin:/usr/local/bin:/usr/bin:/bin"
  PYTHONPATH: "/workspace/dcu_megatron:/workspace/dcu_areal:/workspace/dcu_megatron/Megatron-Bridge/src:/workspace/dcu_megatron/Megatron-LM:/workspace/sglang/python"
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"
  RAY_DEDUP_LOGS: "0"
  RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  TMPDIR: "/dev/shm"
  TEMP: "/dev/shm"
  TMP: "/dev/shm"
  XDG_CACHE_HOME: "/workspace/areal_cache/xdg"
  TORCHINDUCTOR_CACHE_DIR: "/workspace/areal_cache/torchinductor_cache"
  TRITON_CACHE_DIR: "/workspace/areal_cache/triton_cache"
  TORCH_EXTENSIONS_DIR: "/workspace/areal_cache/torch_extensions"

  USE_DCU_CUSTOM_ALLREDUCE: "1"
  SGL_CHUNKED_PREFIX_CACHE_THRESHOLD: "0"
  SGLANG_CHUNKED_PREFIX_CACHE_THRESHOLD: "0"
  SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "1200"
  GLIBC_TUNABLES: "glibc.rtld.optional_static_tls=0x40000"
  SGLANG_SET_CPU_AFFINITY: "1"
  HIP_KERNEL_BATCH_CEILING: "100"
  GPU_MAX_HW_QUEUES: "3"

  SGLANG_KVALLOC_KERNEL: "1"
  SGLANG_ASSIGN_EXTEND_CACHE_LOCS: "1"
  SGLANG_ASSIGN_REQ_TO_TOKEN_POOL: "1"
  SGLANG_GET_LAST_LOC: "1"
  SGLANG_CREATE_FLASHMLA_KV_INDICES_TRITON: "1"
  SGLANG_CREATE_CHUNKED_PREFIX_CACHE_KV_INDICES: "1"

  HIP_H2D_DISABLE_COPY_BUFFER: "0"
  HIP_D2H_DISABLE_COPY_BUFFER: "0"
  HIP_H2D_DIRECT_COPY_THRESHOLD: "32768"
  HIP_H2D_HSAAPI_COPY_THRESHOLD: "32768"
  HIP_D2H_DIRECT_COPY_THRESHOLD: "512"
  HIP_D2H_HSAAPI_COPY_THRESHOLD: "512"
