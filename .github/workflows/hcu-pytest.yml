name: HCU Pytest

on:
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: pytest-cpu-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Public CPU unit tests
    # CPU-only Kubernetes runner; the job container must not see HCU devices.
    runs-on: hygon-cpu
    if: ${{ github.event.label.name == 'run-ci' && !github.event.pull_request.draft }}
    timeout-minutes: 45
    container:
      image: ${{ vars.HCU_BASE_IMAGE_V2 }}
    defaults:
      run:
        shell: bash
    env:
      CI_PYTHON: ${{ vars.HCU_CI_PYTHON || 'python' }}
      HCU_CI_PYTHON: ${{ vars.HCU_CI_PYTHON || 'python' }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/3rdparty/AReaL:${{ github.workspace }}/3rdparty/Megatron-LM-das:${{ github.workspace }}/3rdparty/Megatron-LM-das/3rdparty/Megatron-LM:${{ github.workspace }}/3rdparty/Megatron-bridge-das:${{ github.workspace }}/3rdparty/Megatron-bridge-das/hcu_megatron_bridge/src:${{ github.workspace }}/3rdparty/Megatron-bridge-das/3rdparty/Megatron-Bridge/src:/opt/sglang/python:/usr/local/
      LD_LIBRARY_PATH: /opt/dtk/.hyhal/rocm_smi/lib:/opt/dtk/.hyhal/hydm/lib:/opt/dtk/.hyhal/lib:/usr/local/lib:/usr/local/lib64:/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib:/opt/ucx/lib:/opt/mpi/lib:/opt/hwloc/lib
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      HOME: /tmp

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify this job has no HCU devices
        run: |
          "${CI_PYTHON}" -c '
          import sys
          import torch
          print("python:", sys.version)
          print("torch:", torch.__version__)
          print("HCU available:", torch.cuda.is_available())
          assert sys.version_info >= (3, 11)
          assert not torch.cuda.is_available(), "This workflow must not expose HCU devices"
          '

      - name: Run public CPU unit tests
        run: |
          bash .github/scripts/run_hcu_unit_tests.sh

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cpu-${{ github.run_id }}
          path: pytest-cpu.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean generated test artifacts
        if: always()
        run: rm -f pytest-cpu.xml
