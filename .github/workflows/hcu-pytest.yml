name: HCU Pytest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "areal/**"
      - "tests/**"
      - "requirements-hcu.txt"
      - "pyproject.toml"
      - ".github/workflows/hcu-pytest.yml"
  push:
    branches: [main]
    paths:
      - "areal/**"
      - "tests/**"
      - "requirements-hcu.txt"
      - "pyproject.toml"
      - ".github/workflows/hcu-pytest.yml"

permissions:
  contents: read

concurrency:
  group: pytest-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Public CPU unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-hcu.txt
            pyproject.toml

      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-hcu.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest

      - name: Verify CPU-only runtime
        run: |
          python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert not torch.cuda.is_available(), "This workflow must use CPU PyTorch"
          PY

      - name: Run public CPU unit tests
        run: |
          pytest -q --maxfail=1 --durations=20 \
            --junitxml=pytest-cpu.xml \
            -m "not slow and not gpu and not multi_gpu and not sglang and not vllm and not integration" \
            tests/test_allocation_mode.py \
            tests/test_adv_norm_config.py \
            tests/test_dynamic_import.py \
            tests/test_functional.py \
            tests/test_math_verify_reward.py \
            tests/test_network_ipv6_utils.py \
            tests/test_ppo_stats.py \
            tests/test_prox_approx.py \
            tests/test_rejection_sampling.py \
            tests/test_utils.py \
            tests/test_workflow_detection.py \
            tests/test_wrapper.py

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cpu-${{ github.run_id }}
          path: pytest-cpu.xml
          if-no-files-found: ignore
          retention-days: 14
