name: HCU Image Build and Test

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Official HCU SGLang base image (overrides repository variable HCU_BASE_IMAGE)"
        required: false
        type: string
      base_image_archive:
        description: "Shared Docker image archive (overrides repository variable HCU_BASE_IMAGE_ARCHIVE)"
        required: false
        type: string
  pull_request:
    paths:
      - "areal/**"
      - "examples/**"
      - "hcu_example/**"
      - "requirements-hcu.txt"
      - "pyproject.toml"
      - "docker/Dockerfile.hcu"
      - ".github/workflows/hcu-image-test.yml"
  push:
    branches: [main]
    paths:
      - "areal/**"
      - "examples/**"
      - "hcu_example/**"
      - "requirements-hcu.txt"
      - "pyproject.toml"
      - "docker/Dockerfile.hcu"
      - ".github/workflows/hcu-image-test.yml"

permissions:
  contents: read

concurrency:
  group: hcu-image-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-test:
    # The ci-general runner group provides Docker and HCU access.
    runs-on:
      group: ci-general
      labels: [self-hosted, ci]
    timeout-minutes: 45
    env:
      BASE_IMAGE: ${{ inputs.base_image || vars.HCU_BASE_IMAGE || 'areal-das:1.0.4-20260902' }}
      BASE_IMAGE_ARCHIVE: ${{ inputs.base_image_archive || vars.HCU_BASE_IMAGE_ARCHIVE || '/public/home/niuhb/AReal-das-1.0.4-20260902.tar.gz' }}
      IMAGE_TAG: areal-das:hcu-ci-${{ github.sha }}

    steps:
      - name: Check base-image configuration
        run: |
          test -n "${BASE_IMAGE}" || {
            echo "Set repository variable HCU_BASE_IMAGE or provide workflow_dispatch input base_image."
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@v6

      - name: Check HCU runner prerequisites
        run: |
          test -e /dev/kfd
          test -e /dev/dri
          test -e /dev/mkfd
          test -x /opt/hyhal/bin/hy-smi
          /opt/hyhal/bin/hy-smi
          docker version

      - name: Ensure base image is available
        run: |
          if docker image inspect "${BASE_IMAGE}" >/dev/null 2>&1; then
            echo "Using existing local image: ${BASE_IMAGE}"
          else
            test -r "${BASE_IMAGE_ARCHIVE}" || {
              echo "Docker image ${BASE_IMAGE} is unavailable and archive ${BASE_IMAGE_ARCHIVE} is not readable."
              exit 1
            }
            echo "Loading ${BASE_IMAGE} from ${BASE_IMAGE_ARCHIVE}"
            docker load -i "${BASE_IMAGE_ARCHIVE}"
            docker image inspect "${BASE_IMAGE}" >/dev/null
          fi

      - name: Build AReaL-das HCU image
        run: |
          docker build \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --file docker/Dockerfile.hcu \
            --tag "${IMAGE_TAG}" \
            .

      - name: Test imports and HCU visibility in image
        run: |
          docker run --rm \
            -e UMASK=000 \
            --shm-size=100g \
            --network=host \
            --privileged \
            --device=/dev/kfd \
            --device=/dev/dri \
            --device=/dev/mkfd \
            --group-add=video \
            --mount type=bind,src=/opt/hyhal,dst=/opt/hyhal,readonly \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --ulimit memlock=-1:-1 \
            --ipc=host \
            --user=root \
            "${IMAGE_TAG}" \
            bash -lc 'source /opt/dtk/env.sh && exec python -c "$1"' bash '
          from importlib.metadata import PackageNotFoundError, version
          from packaging.version import Version
          import areal
          import sglang
          import torch

          try:
              sglang_version = version("sglang")
          except PackageNotFoundError:
              sglang_version = sglang.__version__

          print("torch:", torch.__version__, "hip=", torch.version.hip)
          print("areal:", areal.__file__)
          print("sglang:", sglang.__file__, sglang_version)
          assert torch.version.hip is not None, "HCU PyTorch is required"
          assert torch.cuda.device_count() > 0, "No HCU device is visible"
          assert torch.cuda.is_available(), "HCU runtime is unavailable"
          assert torch.ones(1, device="cuda").item() == 1
          assert Version(sglang_version) >= Version("0.5.12")
          '

      - name: Test AReaL source and HCU launchers in image
        run: |
          docker run --rm "${IMAGE_TAG}" bash -lc '
            python -m compileall -q areal hcu_example &&
            find hcu_example -type f -name "*.sh" -print0 | xargs -0 -r -n1 bash -n &&
            python -c "import areal.engine.hcu"
          '
