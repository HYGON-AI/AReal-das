name: HCU Image Runtime Test

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Existing HCU runtime image (overrides repository variable HCU_BASE_IMAGE_V2)"
        required: false
        type: string
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: hcu-image-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  image-test:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.label.name == 'run-ci' && !github.event.pull_request.draft) }}
    # Kubernetes runner with HCU device access; the job runs directly in the
    # selected image, so no nested docker invocation is needed.
    runs-on: hygon-bw1100-1card
    timeout-minutes: 45
    container:
      image: ${{ inputs.base_image || vars.HCU_BASE_IMAGE_V2 }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Check HCU runner prerequisites
        run: |
          test -e /dev/kfd
          test -e /dev/dri
          test -e /dev/mkfd
          test -x /opt/hyhal/bin/hy-smi
          timeout 15 /opt/hyhal/bin/hy-smi

      - name: Test imports and HCU visibility in image
        run: |
          set -e
          source /opt/dtk/env.sh
          export PYTHONPATH="/opt/hyhal/share/smi${PYTHONPATH:+:${PYTHONPATH}}"
          prepared_pythonpath="$(python -m hcu_areal.launch --pythonpath)"
          export PYTHONPATH="${prepared_pythonpath}"
          exec python .github/scripts/check_image.py

      - name: Test AReaL source and HCU launchers in image
        run: |
          set -e
          source /opt/dtk/env.sh
          prepared_pythonpath="$(python -m hcu_areal.launch --pythonpath)"
          export PYTHONPATH="${prepared_pythonpath}"
          python -m compileall -q 3rdparty/AReaL/areal hcu_areal examples tests &&
          find examples tests .github/scripts -type f -name "*.sh" -print0 | xargs -0 -r -n1 bash -n &&
          python -c "import hcu_areal.engine.megatron_engine"
        env:
          PYTHONPYCACHEPREFIX: /tmp/hcu-ci-pycache
