name: HCU Image Runtime Test

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Existing HCU runtime image (overrides repository variable HCU_BASE_IMAGE_V2)"
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".gitmodules"
      - "3rdparty/**"
      - "hcu_areal/**"
      - ".github/scripts/check_image.py"
      - "examples/**"
      - "requirements.txt"
      - ".github/workflows/hcu-image-test.yml"
permissions:
  contents: read

concurrency:
  group: hcu-image-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-test:
    # The ci-general runner group provides Docker and HCU access.
    runs-on:
      group: ci-general
      labels: [self-hosted, ci]
    timeout-minutes: 45
    env:
      BASE_IMAGE: ${{ inputs.base_image || vars.HCU_BASE_IMAGE_V2 }}
      BASE_IMAGE_ARCHIVE: ${{ vars.HCU_BASE_IMAGE_ARCHIVE_V2 }}

    steps:
      - name: Prepare base image and workspace
        run: |
          set -Eeuo pipefail
          test -n "${BASE_IMAGE}" || {
            echo "Set repository variable HCU_BASE_IMAGE_V2 or provide workflow_dispatch input base_image."
            exit 1
          }
          if ! docker image inspect "${BASE_IMAGE}" >/dev/null 2>&1; then
            test -r "${BASE_IMAGE_ARCHIVE}" || {
              echo "::error::Docker image ${BASE_IMAGE} is unavailable and archive ${BASE_IMAGE_ARCHIVE} is not readable."
              exit 2
            }
            echo "Loading ${BASE_IMAGE} from ${BASE_IMAGE_ARCHIVE}"
            docker load -i "${BASE_IMAGE_ARCHIVE}"
          fi
          mkdir -p "${GITHUB_WORKSPACE}"
          docker run --rm --entrypoint /bin/bash \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${BASE_IMAGE}" \
            -c 'chown -Rh "${HOST_UID}:${HOST_GID}" /workspace'

      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          allow-unsafe-pr-checkout: true
          submodules: recursive

      - name: Check HCU runner prerequisites
        run: |
          test -e /dev/kfd
          test -e /dev/dri
          test -e /dev/mkfd
          test -x /opt/hyhal/bin/hy-smi
          /opt/hyhal/bin/hy-smi
          docker version

      - name: Test imports and HCU visibility in image
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e UMASK=000 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --shm-size=100g \
            --network=host \
            --privileged \
            --device=/dev/kfd \
            --device=/dev/dri \
            --device=/dev/mkfd \
            --group-add=video \
            -v /opt/hyhal:/opt/hyhal:ro \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --ulimit memlock=-1:-1 \
            --ipc=host \
            --user=root \
            -v "${GITHUB_WORKSPACE}:/workspace/AReal-das:ro" \
            -w /workspace/AReal-das \
            "${BASE_IMAGE}" \
            -lc '
              set -e
              source /opt/dtk/env.sh
              export PYTHONPATH="/opt/hyhal/share/smi${PYTHONPATH:+:${PYTHONPATH}}"
              prepared_pythonpath="$(python -m hcu_areal.launch --pythonpath)"
              export PYTHONPATH="${prepared_pythonpath}"
              exec python .github/scripts/check_image.py
            '

      - name: Test AReaL source and HCU launchers in image
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e PYTHONPYCACHEPREFIX=/tmp/hcu-ci-pycache \
            -v "${GITHUB_WORKSPACE}:/workspace/AReal-das:ro" \
            -w /workspace/AReal-das \
            "${BASE_IMAGE}" -lc '
            set -e
            source /opt/dtk/env.sh
            prepared_pythonpath="$(python -m hcu_areal.launch --pythonpath)"
            export PYTHONPATH="${prepared_pythonpath}"
            python -m compileall -q 3rdparty/AReaL/areal hcu_areal examples tests &&
            find examples tests .github/scripts -type f -name "*.sh" -print0 | xargs -0 -r -n1 bash -n &&
            python -c "import hcu_areal.engine.megatron_engine"
          '
