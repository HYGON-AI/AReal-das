name: HCU PR Model Smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read

concurrency:
  group: hcu-pr-model-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  model-smoke:
    name: Selected model smoke
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.label.name == 'run-ci' && !github.event.pull_request.draft) }}
    # Dedicated Kubernetes runner with eight HCU devices and the shared model
    # directory already mounted. No nested docker is used.
    runs-on: hygon-bw1100-8card
    timeout-minutes: 120
    container:
      image: ${{ vars.HCU_BASE_IMAGE_V2 }}
    defaults:
      run:
        shell: bash
    env:
      AREAL_CI_MODELS_ROOT_V2: ${{ vars.AREAL_CI_MODELS_ROOT_V2 }}
      AREAL_CI_VENV: /opt/areal-venv-py31115
      AREAL_CI_SGLANG_ROOT: /opt/sglang
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Select model cases
        run: python3 .github/scripts/plan_model_cases.py --output ci-model-plan.tsv

      - name: Verify HCU configuration
        run: |
          set -Eeuo pipefail
          for name in \
            AREAL_CI_MODELS_ROOT_V2 \
            AREAL_CI_VENV \
            AREAL_CI_SGLANG_ROOT
          do
            test -n "${!name:-}" || {
              echo "::error::Runner environment variable ${name} is not configured."
              exit 2
            }
          done
          test -e /dev/kfd
          test -e /dev/dri
          test -e /dev/mkfd
          test -x /opt/hyhal/bin/hy-smi
          timeout 15 /opt/hyhal/bin/hy-smi
          timeout 15 /opt/hyhal/bin/hy-smi --showmeminfo vram
          device_processes="$(timeout 15 /opt/hyhal/bin/hy-smi --showpids)"
          printf '%s\n' "${device_processes}"
          if printf '%s\n' "${device_processes}" | grep -Eq 'HCU Index:[[:space:]]*\[[^]]+\]'; then
            echo "::error::HCU devices already have active processes; choose an idle runner."
            exit 1
          fi

      - name: Run selected model smoke cases
        run: |
          set -Eeuo pipefail
          if [[ "${AREAL_CI_MODELS_ROOT_V2}" != /* ]] ||
             ! models_root="$(realpath -e -- "${AREAL_CI_MODELS_ROOT_V2}")" ||
             [[ ! -d "${models_root}" || "${models_root}" == / ]]; then
            echo "::error::AREAL_CI_MODELS_ROOT_V2 must point to a shared model directory"
            exit 2
          fi
          mkdir -p ci-artifacts ci-runtime ci-cache

          failed=0
          while IFS=$'\t' read -r case_name case_config model_relative_path case_gpus; do
          if ! model_path="$(realpath -e -- "${models_root}/${model_relative_path}")" ||
             [[ "${model_path}" != "${models_root}/"* || ! -r "${model_path}/config.json" ]]; then
            echo "::error::${case_name}: ${model_relative_path} must resolve to a readable model directory under AREAL_CI_MODELS_ROOT_V2"
            failed=1
            continue
          fi
          mkdir -p "ci-artifacts/${case_name}" "ci-runtime/${case_name}" "ci-cache/${case_name}"
          echo "Running ${case_name} using ${case_config}"
          if (
            export MODEL_PATH="${model_path}"
            export CI_MODEL_CASE="${case_name}"
            export CI_MODEL_GPUS="${case_gpus}"
            export CI_EXAMPLE_CONFIG="${case_config}"
            export AREAL_RUNS_ROOT="${GITHUB_WORKSPACE}/ci-artifacts/${case_name}/runs"
            export AREAL_RUNTIME_ROOT="${GITHUB_WORKSPACE}/ci-runtime/${case_name}"
            export AREAL_CACHE_ROOT="${GITHUB_WORKSPACE}/ci-cache/${case_name}"
            export CI_SUCCESS_MARKER="${GITHUB_WORKSPACE}/ci-artifacts/${case_name}/smoke-success"
            export PYTHONDONTWRITEBYTECODE=1
            export SGLANG_HOME="${AREAL_CI_SGLANG_ROOT}/python"
            if [[ -x "${AREAL_CI_VENV}/bin/python" ]]; then
              source "${AREAL_CI_VENV}/bin/activate"
            fi
            export PYTHONPATH="${PWD}:${SGLANG_HOME}:/opt/hyhal/share/smi:${PYTHONPATH:-}"
            exec python3 .github/scripts/run_model_smoke.py
          ); then
            if ! test -s "ci-artifacts/${case_name}/smoke-success"; then
              echo "::error::${case_name}: success marker is missing"
              failed=1
            fi
          else
            echo "::error::${case_name}: smoke test failed"
            failed=1
          fi
          done < ci-model-plan.tsv
          exit "${failed}"

      - name: Upload model smoke logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hcu-model-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            ci-runtime/
          if-no-files-found: ignore
          retention-days: 14
