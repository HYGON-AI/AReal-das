name: HCU Source Checks

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: hcu-source-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source, Python, and shell checks
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.label.name == 'run-ci' && !github.event.pull_request.draft) }}
    # CPU-only Kubernetes runner; no HCU devices are required or exposed.
    runs-on: hygon-cpu
    timeout-minutes: 45
    container:
      image: ${{ vars.HCU_BASE_IMAGE_V2 }}
    defaults:
      run:
        shell: bash
    env:
      CI_PYTHON: ${{ vars.HCU_CI_PYTHON || 'python' }}
      HCU_CI_PYTHON: ${{ vars.HCU_CI_PYTHON || 'python' }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/3rdparty/AReaL:${{ github.workspace }}/3rdparty/Megatron-LM-das:${{ github.workspace }}/3rdparty/Megatron-LM-das/3rdparty/Megatron-LM:${{ github.workspace }}/3rdparty/Megatron-bridge-das:${{ github.workspace }}/3rdparty/Megatron-bridge-das/hcu_megatron_bridge/src:${{ github.workspace }}/3rdparty/Megatron-bridge-das/3rdparty/Megatron-Bridge/src:/opt/sglang/python:/usr/local/
      LD_LIBRARY_PATH: /opt/dtk/.hyhal/rocm_smi/lib:/opt/dtk/.hyhal/hydm/lib:/opt/dtk/.hyhal/lib:/usr/local/lib:/usr/local/lib64:/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib:/opt/ucx/lib:/opt/mpi/lib:/opt/hwloc/lib
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_INDEX_URL: https://pypi.org/simple
      PRE_COMMIT_HOME: /tmp/pre-commit
      RUFF_CACHE_DIR: /tmp/ruff-cache
      HOME: /tmp

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify CI image Python
        run: |
          "${CI_PYTHON}" -c \
            'import sys; print(sys.version); assert sys.version_info >= (3, 11)'

      - name: Run pre-commit checks
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global http.version HTTP/1.1
          "${HCU_CI_PYTHON}" -m venv /tmp/pre-commit-venv
          /tmp/pre-commit-venv/bin/python -m pip install \
            --index-url https://pypi.org/simple pre-commit
          /tmp/pre-commit-venv/bin/pre-commit run --all-files

      - name: Check Python syntax
        run: |
          "${CI_PYTHON}" -m compileall -q \
            3rdparty/AReaL/areal hcu_areal examples tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache

      - name: Check HCU launcher syntax
        run: |
          find examples tests .github/scripts -type f -name "*.sh" -print0 |
            xargs -0 -r -n1 bash -n

      - name: Check public HCU requirements policy
        run: |
          if grep -nE '^.*\+das|^.*dtk[0-9]|^(torch|torchvision|triton|flash_attn|transformer_engine|hcu-megatron)==' requirements.txt; then
            echo "requirements.txt must not contain internal HCU build pins."
            exit 1
          fi
