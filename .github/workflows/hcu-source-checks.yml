name: HCU Source Checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - v1.0.4

permissions:
  contents: read

concurrency:
  group: hcu-source-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source, format, and shell checks
    runs-on:
      group: ci-general
      labels: [self-hosted, ci]
    timeout-minutes: 45
    env:
      CI_IMAGE: ${{ vars.HCU_BASE_IMAGE || 'areal-das:1.0.4-20260902' }}
      CI_IMAGE_ARCHIVE: ${{ vars.HCU_BASE_IMAGE_ARCHIVE }}
      CI_PYTHON: /opt/areal-venv-py31115/bin/python
      CI_PYTHONPATH: /opt/hcu_megatron:/workspace:/opt/hcu_megatron/Megatron-Bridge/src:/opt/hcu_megatron/Megatron-LM:/opt/sglang/python:/usr/local/
      HCU_LD_LIBRARY_PATH: /opt/dtk/.hyhal/rocm_smi/lib:/opt/dtk/.hyhal/hydm/lib:/opt/dtk/.hyhal/lib:/usr/local/lib:/usr/local/lib64:/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib:/opt/ucx/lib:/opt/mpi/lib:/opt/hwloc/lib

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - name: Verify Python 3.11 CI image
        run: |
          if ! docker image inspect "${CI_IMAGE}" >/dev/null 2>&1; then
            test -r "${CI_IMAGE_ARCHIVE}" || {
              echo "Docker image ${CI_IMAGE} is unavailable and archive ${CI_IMAGE_ARCHIVE} is not readable."
              exit 1
            }
            echo "Loading ${CI_IMAGE} from ${CI_IMAGE_ARCHIVE}"
            docker load -i "${CI_IMAGE_ARCHIVE}"
          fi
          docker image inspect "${CI_IMAGE}" >/dev/null
          docker run --rm \
            -e LD_LIBRARY_PATH="${HCU_LD_LIBRARY_PATH}" \
            -e PYTHONPATH="${CI_PYTHONPATH}" \
            "${CI_IMAGE}" "${CI_PYTHON}" -c \
            'import sys; print(sys.version); assert sys.version_info[:2] == (3, 11)'

      - name: Run pre-commit checks
        # These hooks require a fully installed HCU runtime or regenerate locks;
        # they are run in the matching HCU development environment instead.
        run: |
          docker run --rm \
            --security-opt label=disable \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e USER=github \
            -e LOGNAME=github \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_INDEX_URL=https://pypi.org/simple \
            -e PRE_COMMIT_HOME=/tmp/pre-commit \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache \
            -e LD_LIBRARY_PATH="${HCU_LD_LIBRARY_PATH}" \
            -e PYTHONPATH="${CI_PYTHONPATH}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${CI_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/areal-venv-py31115/bin:${PATH}
              git config --global --add safe.directory /workspace
              python -m venv /tmp/pre-commit-venv
              /tmp/pre-commit-venv/bin/python -m pip install --index-url https://pypi.org/simple pre-commit
              /tmp/pre-commit-venv/bin/pre-commit run --all-files
            '

      - name: Check Python syntax
        run: |
          docker run --rm \
            --security-opt label=disable \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e USER=github \
            -e LOGNAME=github \
            -e LD_LIBRARY_PATH="${HCU_LD_LIBRARY_PATH}" \
            -e PYTHONPATH="${CI_PYTHONPATH}" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${CI_IMAGE}" \
            "${CI_PYTHON}" -m compileall -q areal hcu_example

      - name: Check HCU launcher syntax
        run: |
          find hcu_example -type f -name "*.sh" -print0 |
            xargs -0 -r -n1 bash -n

      - name: Check public HCU requirements policy
        run: |
          if grep -nE '^.*\+das|^.*dtk[0-9]|^(torch|torchvision|triton|flash_attn|transformer_engine|hcu-megatron)==' requirements-hcu.txt; then
            echo "requirements-hcu.txt must not contain internal HCU build pins."
            exit 1
          fi
