runtime:
  base_config: 3rdparty/AReaL/examples/vlm/geometry3k_grpo.yaml
  cache_dir: null
  driver_log: /workspace/runs/logs/geometry3k_gemma3_fsdp/train.log
  entrypoint: 3rdparty/AReaL/examples/vlm/geometry3k_grpo.py
  env:
    ALLREDUCE_STREAM_WITH_COMPUTE: '1'
    AREAL_ALLOW_DEFAULT_ADMIN_KEY: '1'
    GLIBC_TUNABLES: glibc.rtld.optional_static_tls=0x40000
    GPU_MAX_HW_QUEUES: '4'
    HIP_D2H_DIRECT_COPY_THRESHOLD: '512'
    HIP_D2H_DISABLE_COPY_BUFFER: '0'
    HIP_D2H_HSAAPI_COPY_THRESHOLD: '512'
    HIP_H2D_DIRECT_COPY_THRESHOLD: '32768'
    HIP_H2D_DISABLE_COPY_BUFFER: '0'
    HIP_H2D_HSAAPI_COPY_THRESHOLD: '32768'
    HIP_KERNEL_BATCH_CEILING: '100'
    HSA_KERNARG_POOL_SIZE: '8388608'
    NCCL_MAX_NCHANNELS: '16'
    NCCL_MIN_NCHANNELS: '16'
    PYTHONUNBUFFERED: '1'
    RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: '0'
    RAY_DEDUP_LOGS: '0'
    ROC_AQL_QUEUE_SIZE: '131072'
    SGLANG_CHUNKED_PREFIX_CACHE_THRESHOLD: '0'
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '1200'
    SGLANG_SET_CPU_AFFINITY: '1'
    SGL_CHUNKED_PREFIX_CACHE_THRESHOLD: '0'
    TOKENIZERS_PARALLELISM: 'false'
    TORCHDYNAMO_DISABLE: '1'
    TORCH_COMPILE_DISABLE: '1'
    USE_HCU_CUSTOM_ALLREDUCE: '1'
  ray:
    address: null
    mode: auto
    node_ip: null
    num_cpus: null
    num_gpus: null
    temp_dir: null
  temp_dir: null
  unset_env:
  - SGLANG_ENABLE_SPEC_V2
  - SGLANG_CREATE_EXTEND_AFTER_DECODE_SPEC_INFO
  - SGLANG_SPEC_NAN_DETECTION
  - SGLANG_SPEC_OOB_DETECTION
  - SGLANG_KVALLOC_KERNEL
  - SGLANG_ASSIGN_EXTEND_CACHE_LOCS
  - SGLANG_ASSIGN_REQ_TO_TOKEN_POOL
  - SGLANG_GET_LAST_LOC
  - SGLANG_CREATE_FLASHMLA_KV_INDICES_TRITON
  - SGLANG_CREATE_CHUNKED_PREFIX_CACHE_KV_INDICES
  - SGLANG_USE_FP8_W8A8_MOE
  - SGLANG_USE_LIGHTOP
  - SGLANG_USE_OPT_CAT
  - SGLANG_USE_FUSED_RMSNORM_ROPE
  - SGLANG_USE_RMS_QUANT_PATH
  - USE_FUSED_RMS_QUANT_PATH
  - PYTORCH_ALLOC_CONF
  - PYTORCH_CUDA_ALLOC_CONF
training:
  actor:
    _version: v1
    attn_impl: sdpa
    eps_clip: 0.2
    fsdp:
      memory_efficient_load: true
      offload_params: false
    mask_no_eos_with_zero: true
    mb_spec:
      packing_algorithm: ffd
    optimizer:
      lr: 1.0e-06
    path: "<模型目录>"
    weight_update_mode: xccl
  cluster:
    fileroot: /workspace/runs
    name_resolve:
      nfs_record_root: /workspace/runs
  evaluator:
    freq_epochs: null
  experiment_name: geometry3k-gemma3-4b-fsdp
  gconfig:
    max_new_tokens: 32
    n_samples: 2
  recover:
    freq_epochs: null
  rollout:
    _version: v1
    backend: sglang:d1p1t2
    max_concurrent_rollouts: 1
    setup_timeout: 1200
  saver:
    freq_epochs: null
  scheduler:
    type: ray
  sglang:
    attention_backend: triton
    chunked_prefill_size: -1
    context_length: 8192
    disable_cuda_graph: true
    disable_custom_all_reduce: false
    disable_radix_cache: true
    dtype: bfloat16
    enable_nan_detection: false
    kv_cache_dtype: auto
    max_running_requests: 1
    model_path: ${actor.path}
    page_size: 64
  tokenizer_path: ${actor.path}
  total_train_epochs: 1
  total_train_steps: 2
  train_dataset:
    batch_size: 4
    max_length: 4096
    scheduling_spec: null
  trial_name: fsdp4-sglang-tp2-standalone-aligned
  valid_dataset:
    batch_size: 4
    scheduling_spec: null
